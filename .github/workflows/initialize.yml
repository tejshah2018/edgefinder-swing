name: Install EDGEFINDER sector rotation
on:
  push:
    paths: ['.github/workflows/initialize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tested rotation source once
        shell: python
        run: |
          import base64,gzip,json,pathlib
          if pathlib.Path('rotation.js').exists():
              print('Rotation already installed; existing source is not overwritten.')
          else:
              files=json.loads(gzip.decompress(base64.b64decode('')))
              for name,content in files.items():
                  p=pathlib.Path(name)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(content)
      - name: Validate rotation and unchanged scorer
        run: |
          node tests/test_rotation.cjs
          node tests/test_frontend.cjs
          node tests/test_history.cjs
      - name: Commit tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rotation.js tests/test_rotation.cjs index.html app.js styles.css scripts/update_data.py
          if ! git diff --cached --quiet; then
            git commit -m 'Add sector and style rotation with weekly trails and flow proxies'
            git push
          fi
