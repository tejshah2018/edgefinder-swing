name: Initialize attached EDGEFINDER source
on:
  push:
    paths: ['.github/workflows/initialize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install attached source once
        shell: python
        run: |
          import base64,gzip,json,pathlib
          if pathlib.Path('app.js').exists():
              print('Source already initialized; nothing to overwrite.')
          else:
              files=json.loads(gzip.decompress(base64.b64decode('')))
              for name,content in files.items():
                  p=pathlib.Path(name)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(content)
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m 'Install attached EDGEFINDER source with deployment reliability fixes'
            git push
          fi
