name: Install EDGEFINDER signal-history module
on:
  push:
    paths: ['.github/workflows/initialize.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install signal-history source once
        shell: python
        run: |
          import base64,gzip,json,pathlib
          if pathlib.Path('scripts/update_history.cjs').exists():
              print('Signal history already installed; existing source is not overwritten.')
          else:
              files=json.loads(gzip.decompress(base64.b64decode('')))
              for name,content in files.items():
                  p=pathlib.Path(name)
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_text(content)
      - name: Commit source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/update_history.cjs tests/test_history.cjs tests/test_history_ui.cjs history.js history.css index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Add forward signal journal with unchanged scoring and 2/5/10-session outcomes'
            git push
          fi
